name: Deploy to GitHub Pages

# Publishes web/dist to https://withoz.github.io/axia3d/ on every push to main.
#
# ⚠ This was parked from 2026-07-14 to 2026-08-31 and the reason is worth
# keeping. The first push to withoz/axia3d failed at `actions/configure-pages@v4`
# with "Get Pages site failed ... HttpError: Not Found": Pages had never been
# configured for the repository. The workflow was correct and the setting did not
# exist. Rather than leave a job that went red on every main push -- which trains
# everyone to ignore CI -- the `push` trigger was removed and the file kept ready.
#
# Pages was enabled 2026-08-31 (Settings -> Pages -> Source: GitHub Actions, which
# the API calls `build_type: workflow`), so the trigger is back.
#
# ⚠ A second break was found in the same pass, one step further down, and is
# fixed below. `npm ci` still ran inside ./web, but ADR-265 (8513ec3) moved
# package-lock.json to the repository root for npm workspaces. ADR-266 (239112e)
# realigned build.yml and ci.yml and fixed this file's `cache-dependency-path` --
# and stopped there. So enabling Pages alone would have bought a run that failed
# at "npm ci" instead, on a lock file that has not existed since July. Install at
# the root, the way the other two workflows do.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          # ADR-265 (8513ec3) moved web/package-lock.json → root package-lock.json
          # (npm workspaces). ADR-266 (239112e) realigned build.yml + ci.yml but
          # missed this workflow, so setup-node hard-threw "Some specified paths
          # were not resolved, unable to cache dependencies" on any push to main.
          cache-dependency-path: 'package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Build WASM
        working-directory: ./crates/axia-wasm
        run: wasm-pack build --target web --out-dir ../../web/src/wasm

      # ADR-265 (8513ec3) -- npm workspace root. There is no web/package-lock.json
      # to install from, so this must not carry `working-directory: ./web`.
      - name: Install dependencies (npm workspace root)
        run: npm ci

      # ⚠ The deployed build does not pre-warm OpenCascade. ADR-119 turned the
      # pre-warm on by default to buy back ADR-082 Drift #5's 180-second wait,
      # which is the right bargain for someone running the app locally and the
      # wrong one for a public site: measured on the live site, it adds 115.1 MB
      # to every visit against an app that is 6.4 MB, whether or not the visitor
      # ever opens a STEP file. A visitor who wants it can still set
      # `axia:step-iges-prewarm = 'true'`; ADR-119's local default is untouched.
      - name: Build
        working-directory: ./web
        env:
          VITE_STEP_PREWARM: 'off'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # ⚠ A clean build is ~231 MB, of which ~222 MB is the OpenCascade WASM for
      # STEP/IGES. Under the 1 GB Pages limit, and it is why this upload is slow.
      #
      # ⚠ The first version of this comment said "a visitor who never opens a
      # STEP file never fetches OCCT". That was asserted, not measured, and it is
      # false. ADR-119's pre-warm (`axia:step-iges-prewarm`, default ON) starts
      # pulling OCCT through `requestIdleCallback` about 1.2 s after load, so it
      # arrives whether or not anyone opens a STEP file. Measured on the live
      # site with `performance.getEntriesByType('resource')`:
      #
      #   app itself (engine WASM 4.3 MB + JS + CSS + fonts) ...  6.4 MB
      #   OCCT, 7 files, first request at ~1.24 s ............. 115.1 MB
      #
      # That is deliberate for a desktop user -- it is what ADR-119 bought back
      # from ADR-082 Drift #5's 180-second wait -- but on a public site every
      # visitor pays it. Whether the deployed build should keep the default is a
      # product question, not a CI one; see ADR-119 L-119-4.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
